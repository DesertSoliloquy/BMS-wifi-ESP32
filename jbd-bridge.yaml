# ESP32 -> JBD BMS bridge
#
# One ESP32-DevKitC-VIE reads up to 4 JBD (Xiaoxiang) BMS units over Bluetooth
# and serves the data on your LAN:
#   - a web page at http://<board-ip>/ (open it in the tablet's browser)
#   - the ESPHome native API (for Home Assistant, if you use it)
#
# Per board, edit only the two places marked EDIT below:
#   1. the board name
#   2. the list of batteries (name + MAC address)
#
# Built on syssi/esphome-jbd-bms: https://github.com/syssi/esphome-jbd-bms

substitutions:
  # EDIT 1: give every board its own name (lowercase, digits and dashes only)
  name: jbd-bridge-1
  friendly_name: "JBD Bridge 1"

packages:
  # EDIT 2: one line per battery this board should read (1 to 4 lines).
  # id:   short unique tag, lowercase, no spaces (bms1, bms2, ...)
  # name: what you'll see on the tablet
  # mac:  the BMS Bluetooth MAC address (see README, "Find the MAC addresses")
  bms1: !include { file: jbd-bms.yaml, vars: { id: bms1, name: "Battery 1", mac: "11:C1:01:37:C2:A5" } }
  bms2: !include { file: jbd-bms.yaml, vars: { id: bms2, name: "Battery 2", mac: "4F:06:04:37:C2:A5" } }
  bms3: !include { file: jbd-bms.yaml, vars: { id: bms3, name: "Battery 3", mac: "A0:06:04:37:C2:A5" } }
  bms4: !include { file: jbd-bms.yaml, vars: { id: bms4, name: "Battery 4", mac: "38:A2:03:37:C2:A5" } }
  # bms5: !include { file: jbd-bms.yaml, vars: { id: bms4, name: "Battery 5", mac: "F7:A1:03:37:C2:A5" } }

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Reads JBD BMS units over BLE and serves them on the LAN"
  min_version: "2026.1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # Pinned to a tested commit so a future upstream change can't break a rebuild.
  - source: github://syssi/esphome-jbd-bms@48a0d975d98e7bbf8c94f2aad6197e624468a490
    components: [jbd_bms_ble]
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the board can't reach your Wi-Fi it opens its own hotspot
  # ("jbd-bridge-1 setup"), where you can pick a network from a phone.
  ap:
    ssid: "${name} setup"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: INFO

# Home Assistant connection. Harmless if you don't use Home Assistant.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# The page the tablet opens. local: true serves everything from the board,
# so it works on a LAN with no internet.
web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: board_group
      name: "Bridge"
      sorting_weight: 100

esp32_ble:
  # One slot per BMS. The ESP32 supports up to 9, but 4 is a safe ceiling
  # alongside Wi-Fi and the web server.
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    active: false

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    web_server:
      sorting_group_id: board_group
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    web_server:
      sorting_group_id: board_group

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      web_server:
        sorting_group_id: board_group

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: board_group
